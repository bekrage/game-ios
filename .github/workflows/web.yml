name: Web Preview Export
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.6.3
    steps:
      - uses: actions/checkout@v4
      - name: Install matching Godot and web export template
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot*
          echo /tmp/godot >> "$GITHUB_PATH"
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.zip
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -p /tmp/templates.zip templates/web_release.zip > "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/web_release.zip"
      - name: Export single-threaded mobile browser game
        run: |
          set -euo pipefail
          GODOT="/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$GODOT" --headless --editor --import --quit
          mkdir -p build/web
          "$GODOT" --headless --export-release Web build/web/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: BubbleZombie-Web
          path: build/web/
          retention-days: 7
