name: Godot iOS Cloud Build
on:
  workflow_dispatch:
    inputs:
      team_id:
        description: Apple Team ID (10 characters; placeholder allowed for unsigned build)
        default: ABCDE12345
        required: true
      bundle_id:
        description: Unique bundle identifier
        default: com.example.bubbledino
        required: true
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    env:
      GODOT_VERSION: 4.6.3
      APPLE_TEAM: ${{ inputs.team_id }}
      BUNDLE_ID: ${{ inputs.bundle_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and official export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo "/tmp/godot/Godot.app/Contents/MacOS" >> "$GITHUB_PATH"
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.zip
          unzip -q /tmp/templates.zip -d /tmp/templates
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          cp -R /tmp/templates/templates/. "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Configure identifiers
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          team, bundle = os.environ["APPLE_TEAM"], os.environ["BUNDLE_ID"]
          assert re.fullmatch(r"[A-Z0-9]{10}", team), "Invalid Team ID"
          assert re.fullmatch(r"[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+", bundle), "Invalid bundle ID"
          p = Path("export_presets.cfg")
          p.write_text(p.read_text().replace("ABCDE12345", team).replace("com.example.bubbledino", bundle))
          PY
      - name: Import and test
        run: |
          set -euo pipefail
          Godot --headless --editor --import --quit
          Godot --headless --script res://tests/gameplay.gd 2>&1 | tee gameplay-test.log
          grep -q "ALL 53 CHECKS PASSED" gameplay-test.log
          ! grep -E "SCRIPT ERROR|FAIL:" gameplay-test.log
          Godot --headless --script res://tests/audio.gd 2>&1 | tee audio-test.log
          grep -q "AUDIO 16 CHECKS PASSED" audio-test.log
          ! grep -E "SCRIPT ERROR|FAIL:" audio-test.log
      - name: Export Xcode project
        run: |
          mkdir -p build/ios
          Godot --headless --export-release iOS build/ios/BubbleDino.ipa
      - name: Build unsigned iPhone archive
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=$(find build/ios -name '*.xcodeproj' -print -quit)
          test -n "$PROJECT"
          xcodebuild -project "$PROJECT" -scheme BubbleDino -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/build/BubbleDino.xcarchive" CODE_SIGNING_ALLOWED=NO archive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BubbleDino-iOS-unsigned
          path: |
            build/
            gameplay-test.log
            audio-test.log
          retention-days: 7
